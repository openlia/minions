schema: 1
id: personal-finance
name: Personal Finance & Double-Entry Accounting
version: 0.6.1
description: Personal Finance Minion with native hledger reports, confirmed transaction intake, account mappings, and source-linked reviews.
author: OpenLia maintainers
license: MIT
requires:
  core_domains: [inbox, sources]
  tools: [hledger]
domains:
  - path: minions/personal-finance
    kind: extension
    label: Personal Finance
    purpose: Interactive hledger reports and confirmed local bookkeeping; canonical records live in this app's data directory.
    lifecycle: active -> archived
    skills: [personal-finance]
    feature: personal-finance
skills:
  - id: personal-finance
    path: skills/personal-finance
    workspace_domains: [minions/personal-finance]
policy:
  allowed_domains: [minions/personal-finance/data]
  allowed_actions: [record_financial_data]
