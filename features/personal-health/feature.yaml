schema: 1
id: personal-health
name: Personal & Family Health Records
version: 0.4.1
description: Personal Health Minion with family profiles, structured encounters, conditions, treatments, measurements, and source-linked records.
author: OpenLia maintainers
license: MIT
requires:
  core_domains: [inbox, sources, archive]
domains:
  - path: minions/personal-health
    kind: extension
    label: Personal Health
    purpose: Person-scoped health records and input forms; canonical records live in this app's data directory.
    lifecycle: active -> archived
    skills: [personal-health]
    feature: personal-health
skills:
  - id: personal-health
    path: skills/personal-health
    workspace_domains: [minions/personal-health]
policy:
  allowed_domains: [minions/personal-health/data]
