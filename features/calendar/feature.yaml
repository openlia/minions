schema: 1
id: calendar
name: Calendar & Remind Scheduling
version: 0.4.0
description: Calendar Minion with native Remind appointments, confirmed local entry, month/week/timeline views, and companion event notes.
author: OpenLia maintainers
license: MIT
requires:
  core_domains:
    - inbox
  features: []
  tools:
    - remind
domains:
  - path: minions/calendar
    kind: extension
    label: Calendar
    purpose: Native Remind schedule entries and companion event notes owned by the Calendar Minion.
    lifecycle: scheduled -> completed -> archived
    route: event
    tags:
      - calendar
      - event
      - remind
    include_in_briefing: true
    briefing_category: calendar
    skills:
      - calendar
    feature: calendar
skills:
  - id: calendar
    path: skills/calendar
    workspace_domains:
      - minions/calendar
policy:
  allowed_domains:
    - minions/calendar/data
  allowed_actions:
    - create_records
    - update_records
    - archive_records
